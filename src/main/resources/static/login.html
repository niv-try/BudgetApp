<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>התחברות | ניב אגוז</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --glass-bg: rgba(30, 41, 59, 0.85); --glass-border: rgba(255, 255, 255, 0.1); --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); --text-main: #f8fafc; --text-muted: #94a3b8; --accent-purple: #8b5cf6; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Assistant', sans-serif; background: radial-gradient(circle at center, #1e293b, #0f172a, #020617); margin: 0; padding: 20px 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: var(--text-main); overflow-x: hidden; position: relative; }

        /* --- רקע פיננסי מרחף --- */
        .floating-bg-icons {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: -1; overflow: hidden;
        }
        @keyframes float-finance-icon {
            0% { transform: translateY(0) translateX(0) rotate(0deg); }
            33% { transform: translateY(-50px) translateX(30px) rotate(120deg); }
            66% { transform: translateY(20px) translateX(-20px) rotate(240deg); }
            100% { transform: translateY(0) translateX(0) rotate(360deg); }
        }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .login-card { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 40px 25px; border-radius: 24px; box-shadow: var(--glass-shadow); border: 1px solid var(--glass-border); width: 100%; max-width: 400px; text-align: center; animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; position: relative; z-index: 1; }
        .icon-wrapper { width: 70px; height: 70px; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2rem; margin: 0 auto 15px auto; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4); }
        h1 { margin: 0 0 5px 0; font-size: 2rem; font-weight: 800; }
        p.subtitle { color: var(--text-muted); margin: 0 0 30px 0; font-size: 1rem; font-weight: 600; }
        .input-group { position: relative; margin-bottom: 18px; text-align: right; }
        .input-group i { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); transition: color 0.3s; font-size: 1.1rem; pointer-events: none; }
        input { width: 100%; padding: 16px 48px 16px 16px; background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; color: white; font-family: inherit; font-size: 1rem; transition: all 0.3s ease; }
        input:focus { outline: none; border-color: var(--accent-purple); background: rgba(15, 23, 42, 0.95); box-shadow: 0 0 20px rgba(139, 92, 246, 0.25); }
        .input-group:focus-within i { color: var(--accent-purple); }
        .submit-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%); color: white; border: none; border-radius: 14px; font-size: 1.15rem; font-weight: 800; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4); margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .submit-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(139, 92, 246, 0.6); }
        .register-link { margin-top: 25px; display: block; color: var(--text-muted); text-decoration: none; font-weight: 600; transition: color 0.3s; }
        .register-link:hover { color: white; }
        .credit { color: var(--text-muted); font-size: 0.85rem; margin-top: 20px; font-weight: 600; }

        .error-msg { color: #fca5a5; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px; border-radius: 10px; margin-bottom: 20px; font-size: 0.9rem; font-weight: 600; display: none; }
    </style>
</head>
<body>

<script>
    // יצירת רקע הפיננסים המרחף במסך ההתחברות
    function createBackgroundIcons() {
        const bgContainer = document.createElement('div');
        bgContainer.className = 'floating-bg-icons';
        document.body.appendChild(bgContainer);

        const icons = ['fa-coins', 'fa-wallet', 'fa-chart-line', 'fa-piggy-bank', 'fa-credit-card', 'fa-money-bill-wave', 'fa-sack-dollar', 'fa-vault', 'fa-file-invoice-dollar', 'fa-chart-pie'];
        const numIcons = 18;

        for (let i = 0; i < numIcons; i++) {
            const icon = document.createElement('i');
            const randomIcon = icons[Math.floor(Math.random() * icons.length)];
            icon.className = `fas ${randomIcon}`;

            const size = Math.random() * 90 + 70;

            let left, top;
            const region = Math.random();
            if (region < 0.4) { left = Math.random() * 20; top = Math.random() * 100; }
            else if (region < 0.8) { left = 80 + Math.random() * 20; top = Math.random() * 100; }
            else if (region < 0.9) { left = Math.random() * 100; top = Math.random() * 15; }
            else { left = Math.random() * 100; top = 85 + Math.random() * 15; }

            const duration = Math.random() * 40 + 60;
            const delay = Math.random() * 20;
            const opacity = Math.random() * 0.02 + 0.015;

            icon.style.cssText = `
                    position: absolute; left: ${left}%; top: ${top}%; font-size: ${size}px;
                    color: rgba(147, 197, 253, ${opacity});
                    animation: float-finance-icon ${duration}s infinite ease-in-out; animation-delay: -${delay}s;
                `;
            bgContainer.appendChild(icon);
        }
    }
    createBackgroundIcons();
</script>

<div class="login-card">
    <div class="icon-wrapper">
        <i class="fas fa-fingerprint"></i>
    </div>
    <h1>ברוך שובך</h1>
    <p class="subtitle">ניהול תקציב חכם</p>

    <div id="error-alert" class="error-msg">
        <i class="fas fa-exclamation-triangle"></i> שם משתמש או סיסמה שגויים
    </div>

    <form action="/login" method="POST">
        <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" id="username" name="username" placeholder="שם משתמש" required autocomplete="off">
        </div>

        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" name="password" placeholder="סיסמה" required>
        </div>

        <button type="submit" class="submit-btn">
            התחבר <i class="fas fa-arrow-left"></i>
        </button>
    </form>

    <a href="/register.html" class="register-link">אין לך חשבון? הירשם כאן</a>
    <div class="credit">פותח ע"י ניב אגוז</div>
</div>

<script>
    // בדיקה אם הגיע פרמטר שגיאה ב-URL (כשאורזים שגוי)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('error')) {
        document.getElementById('error-alert').style.display = 'block';
    }
</script>
</body>
</html>
