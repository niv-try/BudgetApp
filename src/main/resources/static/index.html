<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול תקציב חכם</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a, #020617);
            background-attachment: fixed;
            margin: 0;
            padding: 20px 10px;
            color: var(--text-main);
            min-height: 100vh;
        }

        .container { max-width: 1050px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { margin: 0; font-size: 2.2rem; color: #ffffff; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }

        .top-controls { display: flex; justify-content: center; gap: 10px; margin-top: 20px; flex-wrap: wrap;}
        .control-box {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }
        .control-box i { color: var(--text-muted); font-size: 1rem; }
        .control-box select {
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            outline: none;
        }
        select option { background: #1e293b; color: #f8fafc; }

        .export-btn {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 20px 15px;
            border-radius: 16px;
            box-shadow: var(--glass-shadow);
            text-align: center;
            border: 1px solid var(--glass-border);
        }
        .card i { font-size: 1.8rem; margin-bottom: 10px; opacity: 0.9; }
        .card.main-card { background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%); color: white; }
        .card.savings-card { background: linear-gradient(135deg, #312e81 0%, #4338ca 100%); color: white; }
        .card h3 { margin: 0 0 8px 0; font-size: 0.95rem; font-weight: 600; color: var(--text-muted);}
        .card.main-card h3, .card.savings-card h3 { color: rgba(255,255,255,0.8); }
        .card p { margin: 0; font-size: 1.6rem; font-weight: 800; color: var(--text-main); }

        .main-content { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 20px;}
        @media (min-width: 900px) {
            .main-content { grid-template-columns: 1.3fr 1fr; }
            body { padding: 40px 15px; }
            .header h1 { font-size: 3rem; }
            .dashboard { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
            .card p { font-size: 2.3rem; }
        }

        .panel {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            box-shadow: var(--glass-shadow);
            border: 1px solid var(--glass-border);
        }
        .panel h2 { margin-top: 0; font-size: 1.2rem; color: var(--text-main); margin-bottom: 20px; display: flex; align-items: center; gap: 10px;}
        .panel h2 i { color: var(--accent-blue); }

        .form-row { display: flex; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 140px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; color: var(--text-muted); }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(15, 23, 42, 0.6);
            border-radius: 10px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-main);
        }
        input:focus, select:focus { outline: none; border-color: var(--accent-blue); background: rgba(15, 23, 42, 0.9); }

        button.submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 5px;
        }

        .search-bar-wrapper { position: relative; margin-bottom: 15px; }
        .search-bar-wrapper i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-bar { width: 100%; padding: 12px 14px 12px 40px; }

        .list { list-style: none; padding: 0; margin: 0; max-height: 350px; overflow-y: auto;}
        .list li {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255,255,255,0.05);
            border-right: 4px solid #475569;
            margin-bottom: 10px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            border-radius: 10px;
            align-items: center;
        }
        .list li.income { border-right-color: var(--accent-green); }
        .list li.expense { border-right-color: var(--accent-red); }
        .list li.savings { border-right-color: #8b5cf6; }

        .details { display: flex; flex-direction: column; gap: 3px; }
        .details strong { font-size: 1rem; color: var(--text-main); }
        .details span.date { font-size: 0.75rem; color: var(--text-muted); }
        .details span.category { font-size: 0.75rem; color: #cbd5e1; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 15px; width: fit-content; }

        .amount-controls { display: flex; align-items: center; gap: 10px; }
        .amount-controls span { font-weight: 800; font-size: 1.05rem; }
        .list li.income .amount-controls span { color: var(--accent-green); }
        .list li.expense .amount-controls span { color: #fca5a5; }
        .list li.savings .amount-controls span { color: #c4b5fd; }

        .delete-btn {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: none;
            width: 28px; height: 28px;
            border-radius: 6px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .chart-container { position: relative; height: 220px; width: 100%; margin-top: 15px;}
        .empty-state { text-align: center; color: var(--text-muted); padding: 20px 0; font-size: 1rem;}

        .smart-goals-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 20px;}
        .smart-goal-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 16px;
            position: relative;
        }
        .goal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .goal-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
        .goal-target-date { font-size: 0.85rem; color: var(--text-muted); margin-top: 3px; }

        .progress-bar-bg { background: rgba(255,255,255,0.1); height: 10px; border-radius: 5px; margin-bottom: 10px; overflow: hidden;}
        .progress-bar-fill { background: linear-gradient(90deg, #8b5cf6, #3b82f6); height: 100%; border-radius: 5px; transition: width 0.5s ease;}

        .goal-stats { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 10px;}
        .goal-saved { color: var(--text-main); font-weight: 700;}
        .goal-target { color: var(--text-muted); }

        .monthly-recommendation {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #34d399;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
            font-weight: 600;
        }

        .add-goal-form { background: rgba(255,255,255,0.02); padding: 15px; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.1); margin-bottom: 20px;}
        .add-goal-form h3 { margin: 0 0 15px 0; font-size: 1rem; color: var(--text-muted); }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>ניהול תקציב חכם</h1>
        <div class="top-controls">
            <div class="control-box">
                <i class="fas fa-calendar-alt"></i>
                <select id="month-filter" onchange="renderUI()"></select>
            </div>
            <button class="export-btn" onclick="exportToCSV()">
                <i class="fas fa-file-excel"></i> ייצוא
            </button>
            <a href="/logout" class="export-btn" style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); text-decoration: none;">
                <i class="fas fa-sign-out-alt"></i> התנתק
            </a>
        </div>
    </div>

    <div class="dashboard">
        <div class="card main-card">
            <i class="fas fa-wallet" style="color: #60a5fa;"></i>
            <h3>עו"ש</h3>
            <p id="balance" contenteditable="true" onblur="updateManualBalance(this.innerText)" title="לחץ לעריכה ישירה של העו&quot;ש" style="cursor: pointer; border-bottom: 1px dashed rgba(255,255,255,0.4); outline: none;">₪0</p>
        </div>
        <div class="card savings-card">
            <i class="fas fa-vault" style="color: #a78bfa;"></i>
            <h3>סך חיסכון</h3>
            <p id="savings-total">₪0</p>
        </div>
        <div class="card">
            <i class="fas fa-arrow-trend-up income-icon"></i>
            <h3>הכנסות</h3>
            <p id="income" style="color: #34d399;">₪0</p>
        </div>
        <div class="card">
            <i class="fas fa-arrow-trend-down expense-icon"></i>
            <h3>הוצאות</h3>
            <p id="expense" style="color: #f87171;">₪0</p>
        </div>
    </div>

    <div class="panel">
        <h2><i class="fas fa-bullseye"></i> יעדים חכמים</h2>

        <div class="add-goal-form">
            <h3>הגדרת יעד חדש</h3>
            <form id="goal-form" class="form-row" style="margin-bottom: 0;">
                <div class="form-group" style="flex: 2;">
                    <input type="text" id="goal-name" placeholder="לדוגמה: רישיון ואופנוע A1, או חופשה בספטמבר..." required>
                </div>
                <div class="form-group">
                    <input type="number" id="goal-amount" placeholder="סכום יעד (₪)" required min="1">
                </div>
                <div class="form-group">
                    <input type="month" id="goal-date" required>
                </div>
                <div class="form-group" style="min-width: 100px;">
                    <button type="submit" class="submit-btn" style="margin-top: 0; height: 100%; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);"><i class="fas fa-plus"></i></button>
                </div>
            </form>
        </div>

        <div class="smart-goals-container" id="goals-container"></div>
    </div>

    <div class="main-content">
        <div>
            <div class="panel">
                <h2><i class="fas fa-plus-circle"></i> הוספת פעולה</h2>
                <form id="form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="type">סוג</label>
                            <select id="type" onchange="handleTypeChange()">
                                <option value="expense">הוצאה</option>
                                <option value="income">הכנסה</option>
                                <option value="savings">חיסכון</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="category">קטגוריה / יעד</label>
                            <select id="category"></select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="text">תיאור</label>
                            <input type="text" id="text" placeholder="פירוט..." required>
                        </div>
                        <div class="form-group">
                            <label for="amount">סכום (₪)</label>
                            <input type="number" id="amount" placeholder="0" required min="1" step="0.01">
                        </div>
                    </div>
                    <button type="submit" class="submit-btn"><i class="fas fa-check"></i> הוסף</button>
                </form>
            </div>

            <div class="panel" style="margin-top: 20px;">
                <h2><i class="fas fa-chart-pie"></i> התפלגות הוצאות</h2>
                <div class="chart-container">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </div>

        <div class="panel">
            <h2><i class="fas fa-list"></i> היסטוריה</h2>
            <div class="search-bar-wrapper">
                <input type="text" id="search-input" class="search-bar" placeholder="חפש לפי תיאור..." onkeyup="renderUI()">
                <i class="fas fa-search"></i>
            </div>
            <ul id="list" class="list"></ul>
        </div>
    </div>
</div>

<script>
    const API_URL = '/api/transactions';
    const GOALS_API_URL = '/api/goals';
    const ACCOUNT_API_URL = '/api/account';

    const balanceUI = document.getElementById('balance');
    const savingsTotalUI = document.getElementById('savings-total');
    const income = document.getElementById('income');
    const expense = document.getElementById('expense');
    const list = document.getElementById('list');
    const form = document.getElementById('form');
    const goalForm = document.getElementById('goal-form');
    const type = document.getElementById('type');
    const text = document.getElementById('text');
    const amount = document.getElementById('amount');
    const category = document.getElementById('category');
    const monthFilter = document.getElementById('month-filter');
    const searchInput = document.getElementById('search-input');

    let expenseChartInstance = null;
    let transactions = [];
    let smartGoals = [];

    async function fetchData() {
        try {
            const [txRes, goalsRes] = await Promise.all([
                fetch(API_URL),
                fetch(GOALS_API_URL)
            ]);

            if(txRes.ok) transactions = await txRes.json();
            if(goalsRes.ok) smartGoals = await goalsRes.json();

            handleTypeChange();
            populateMonthsDropdown();
            renderUI();
            fetchBalance();
        } catch (error) { console.error("Error fetching data:", error); }
    }

    async function fetchBalance() {
        try {
            const res = await fetch(ACCOUNT_API_URL);
            if(res.ok) {
                const acc = await res.json();
                let bal = acc.balance;

                // מפרידים את סימן המינוס אם קיים
                let sign = bal < 0 ? '-' : '';

                // משנים את הכיוון של העו"ש ספציפית למשמאל לימין כדי שהמינוס יופיע בצד הנכון
                balanceUI.style.direction = 'ltr';
                balanceUI.style.display = 'inline-block';

                // מרכיבים את המספר מחדש עם הערך המוחלט
                balanceUI.innerText = sign + '₪' + Math.abs(bal).toFixed(2);
            }
        } catch (e) { console.error(e); }
    }

    async function updateManualBalance(textValue) {
        // בודקים אם הוקלד מינוס איפשהו בטקסט (מגן על הקוד למקרה שהמינוס קפץ לסוף)
        let isNegative = textValue.includes('-');

        // מנקים מהטקסט הכל חוץ ממספרים ונקודה עשרונית
        let cleanVal = textValue.replace(/[^0-9.]/g, '');
        let newBalance = parseFloat(cleanVal);

        if(isNaN(newBalance)) {
            alert("נא להזין מספר תקין");
            fetchBalance();
            return;
        }

        // אם היה מינוס, אנחנו דואגים להחזיר את המספר למצב שלילי לפני השליחה
        if(isNegative) {
            newBalance = newBalance * -1;
        }

        try {
            const res = await fetch(ACCOUNT_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newBalance)
            });
            if(res.ok) {
                fetchBalance(); // מעדכן חזרה מהשרת
            }
        } catch (e) { console.error(e); }
    }

    async function addSmartGoal(e) {
        e.preventDefault();
        const name = document.getElementById('goal-name').value;
        const targetAmount = parseFloat(document.getElementById('goal-amount').value);
        const targetMonth = document.getElementById('goal-date').value;

        const goal = { name, targetAmount, targetMonth };

        try {
            const res = await fetch(GOALS_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(goal)
            });
            if(res.ok) {
                const savedGoal = await res.json();
                smartGoals.push(savedGoal);
                document.getElementById('goal-name').value = '';
                document.getElementById('goal-amount').value = '';
                document.getElementById('goal-date').value = '';
                handleTypeChange();
                renderUI();
            }
        } catch (error) { console.error(error); }
    }

    async function deleteSmartGoal(id) {
        if(!confirm("האם למחוק יעד זה?")) return;
        try {
            const res = await fetch(`${GOALS_API_URL}/${id}`, { method: 'DELETE' });
            if(res.ok) {
                smartGoals = smartGoals.filter(g => g.id !== id);
                handleTypeChange();
                renderUI();
            }
        } catch (error) { console.error(error); }
    }

    function handleTypeChange() {
        if(type.value === 'savings') {
            if (smartGoals.length === 0) {
                category.innerHTML = '<option value="" disabled selected>אין יעדים מוגדרים, צור יעד למעלה</option>';
            } else {
                category.innerHTML = smartGoals.map(g => `<option value="${g.name}">🎯 ${g.name}</option>`).join('');
            }
        } else if (type.value === 'income') {
            category.innerHTML = `
                <option value="💰 משכורת">💰 משכורת</option>
                <option value="🛵 משלוחים / טיפים">🛵 משלוחים / טיפים</option>
                <option value="שונות">שונות</option>
            `;
        } else {
            category.innerHTML = `
                <option value="🎓 לימודים">🎓 לימודים</option>
                <option value="🏍️ רכב / אופנוע">🏍️ רכב / אופנוע</option>
                <option value="🛒 סופר">🛒 סופר</option>
                <option value="🍔 מסעדות ואוכל">🍔 מסעדות ואוכל</option>
                <option value="🎮 פנאי וגיימינג">🎮 פנאי וגיימינג</option>
                <option value="📱 חשבונות">📱 חשבונות</option>
                <option value="💡 שונות">💡 שונות</option>
            `;
        }
    }

    async function addTransaction(e) {
        e.preventDefault();
        if (type.value === 'savings' && (!category.value || category.value === '')) {
            alert('אנא צור יעד חיסכון קודם.');
            return;
        }

        const transaction = {
            type: type.value,
            text: text.value,
            category: category.value,
            amount: parseFloat(amount.value),
            date: new Date().toISOString().substring(0, 19)
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(transaction)
            });
            if(response.ok) {
                const savedTx = await response.json();
                transactions.push(savedTx);
                text.value = '';
                amount.value = '';
                populateMonthsDropdown();
                renderUI();
                fetchBalance(); // מעדכן גם את העו"ש בשרת
            }
        } catch (error) { console.error(error); }
    }

    async function removeTransaction(id) {
        try {
            const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            if(response.ok) {
                transactions = transactions.filter(t => t.id !== id);
                populateMonthsDropdown();
                renderUI();
                fetchBalance(); // מעדכן את העו"ש אחרי מחיקה
            }
        } catch (error) { console.error(error); }
    }

    function populateMonthsDropdown() {
        const months = new Set();
        transactions.forEach(t => {
            const d = new Date(t.date);
            months.add(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
        });
        const sortedMonths = Array.from(months).sort().reverse();
        const currentVal = monthFilter.value;

        monthFilter.innerHTML = '<option value="all">כל הזמן</option>';
        sortedMonths.forEach(m => {
            const [year, month] = m.split('-');
            const monthName = new Date(year, month - 1).toLocaleString('he-IL', { month: 'long', year: 'numeric' });
            monthFilter.innerHTML += `<option value="${m}">${monthName}</option>`;
        });
        if (currentVal && sortedMonths.includes(currentVal)) { monthFilter.value = currentVal; }
    }

    function renderUI() {
        list.innerHTML = '';
        const filterMonth = monthFilter.value || 'all';
        const searchTerm = searchInput.value.toLowerCase();

        const filteredTransactions = transactions.filter(t => {
            const d = new Date(t.date);
            const monthStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            const matchMonth = filterMonth === 'all' || monthStr === filterMonth;
            const matchSearch = t.text.toLowerCase().includes(searchTerm) || t.category.toLowerCase().includes(searchTerm);
            return matchMonth && matchSearch;
        });

        if (filteredTransactions.length === 0) {
            list.innerHTML = '<li class="empty-state"><i class="fas fa-inbox"></i>אין תנועות</li>';
        } else {
            [...filteredTransactions].reverse().forEach(addTransactionDOM);
        }

        updateValues(filteredTransactions);
        updateChart(filteredTransactions);
        renderSmartGoals();
    }

    function renderSmartGoals() {
        const container = document.getElementById('goals-container');
        container.innerHTML = '';

        if(smartGoals.length === 0) {
            container.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;">לא הוגדרו יעדים חכמים עדיין</div>';
            return;
        }

        const savingsTxs = transactions.filter(t => t.type === 'savings');

        smartGoals.forEach(goal => {
            const savedAmount = savingsTxs
                .filter(t => t.category === goal.name)
                .reduce((acc, t) => acc + t.amount, 0);

            const percentage = Math.min(100, (savedAmount / goal.targetAmount) * 100);

            const today = new Date();
            const targetDate = new Date(goal.targetMonth + "-01");
            let monthsLeft = (targetDate.getFullYear() - today.getFullYear()) * 12 + targetDate.getMonth() - today.getMonth();

            let recommendationText = "";
            let remainingToSave = Math.max(0, goal.targetAmount - savedAmount);

            if (remainingToSave === 0) {
                recommendationText = "🎉 היעד הושלם בהצלחה!";
            } else if (monthsLeft <= 0) {
                recommendationText = `הגעת לתאריך היעד! חסרים ${remainingToSave.toFixed(0)}₪`;
            } else {
                const monthlyRequired = remainingToSave / monthsLeft;
                recommendationText = `כדי לעמוד ביעד, הפרש השבוע/החודש: ₪${monthlyRequired.toFixed(0)}`;
            }

            const displayMonth = targetDate.toLocaleString('he-IL', { month: 'long', year: 'numeric' });

            const card = document.createElement('div');
            card.className = 'smart-goal-card';
            card.innerHTML = `
                <div class="goal-header">
                    <div>
                        <div class="goal-title">${goal.name}</div>
                        <div class="goal-target-date">יעד: ${displayMonth}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteSmartGoal(${goal.id})"><i class="fas fa-times"></i></button>
                </div>
                <div class="goal-stats">
                    <span class="goal-saved">₪${savedAmount.toFixed(0)}</span>
                    <span class="goal-target">מתוך ₪${goal.targetAmount.toFixed(0)}</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width: ${percentage}%"></div>
                </div>
                <div class="monthly-recommendation">${recommendationText}</div>
            `;
            container.appendChild(card);
        });
    }

    function addTransactionDOM(transaction) {
        let sign = transaction.type === 'income' ? '+' : transaction.type === 'expense' ? '-' : '→';
        const displayDate = new Date(transaction.date).toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', year: 'numeric' });
        const item = document.createElement('li');
        item.classList.add(transaction.type);
        item.innerHTML = `
            <div class="details">
                <span class="date">${displayDate}</span>
                <strong>${transaction.text}</strong>
                <span class="category">${transaction.category}</span>
            </div>
            <div class="amount-controls">
                <span>${sign}₪${transaction.amount.toFixed(2)}</span>
                <button class="delete-btn" onclick="removeTransaction(${transaction.id})"><i class="fas fa-trash-alt"></i></button>
            </div>
        `;
        list.appendChild(item);
    }

    function updateValues(filteredData) {
        const incomeTotal = filteredData.filter(item => item.type === 'income').reduce((acc, item) => (acc += item.amount), 0);
        const expenseTotal = filteredData.filter(item => item.type === 'expense').reduce((acc, item) => (acc += item.amount), 0);
        const savingsTotal = filteredData.filter(item => item.type === 'savings').reduce((acc, item) => (acc += item.amount), 0);

        savingsTotalUI.innerText = '₪' + savingsTotal.toFixed(2);
        income.innerText = '₪' + incomeTotal.toFixed(2);
        expense.innerText = '₪' + expenseTotal.toFixed(2);

        // טעינה ועדכון של העו"ש מהשרת
        fetchBalance();
    }

    function updateChart(filteredData) {
        const ctx = document.getElementById('expenseChart').getContext('2d');
        const expenses = filteredData.filter(t => t.type === 'expense');
        const categoryTotals = {};
        expenses.forEach(e => {
            const pureCatName = e.category.replace(/[^א-תa-zA-Z\s]/g, '').trim();
            categoryTotals[pureCatName] = (categoryTotals[pureCatName] || 0) + e.amount;
        });

        if (expenseChartInstance) { expenseChartInstance.destroy(); }
        if(Object.keys(categoryTotals).length === 0) return;

        expenseChartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: Object.keys(categoryTotals),
                datasets: [{
                    data: Object.values(categoryTotals),
                    backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#f97316', '#ec4899'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom', rtl: true, labels: { color: '#cbd5e1', font: { family: 'Assistant', size: 12 } } } },
                cutout: '65%'
            }
        });
    }

    function exportToCSV() {
        if (transactions.length === 0) return alert("אין נתונים");
        let csvContent = "data:text/csv;charset=utf-8,\uFEFFתאריך,סוג,קטגוריה,תיאור,סכום\n";
        transactions.forEach(t => {
            const date = new Date(t.date).toLocaleDateString('he-IL');
            const typeLabel = t.type === 'income' ? 'הכנסה' : t.type === 'expense' ? 'הוצאה' : 'חיסכון';
            csvContent += `"${date}","${typeLabel}","${t.category}","${t.text}","${t.amount}"\n`;
        });
        const link = document.createElement("a");
        link.href = encodeURI(csvContent);
        link.download = "budget_data.csv";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    goalForm.addEventListener('submit', addSmartGoal);
    form.addEventListener('submit', addTransaction);

    fetchData();
</script>
</body>
</html>
