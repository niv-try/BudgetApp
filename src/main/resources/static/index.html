<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ניהול תקציב חכם | ניב אגוז</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
        }

        body {
            font-family: 'Assistant', sans-serif;
            margin: 0;
            padding: 20px 10px;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at top right, #1e293b, #0f172a, #020617);
            z-index: -2;
        }

        .floating-bg-icons {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: -1; overflow: hidden;
        }
        @keyframes float-finance-icon {
            0% { transform: translateY(0) translateX(0) rotate(0deg); }
            33% { transform: translateY(-50px) translateX(30px) rotate(120deg); }
            66% { transform: translateY(20px) translateX(-20px) rotate(240deg); }
            100% { transform: translateY(0) translateX(0) rotate(360deg); }
        }

        .container { max-width: 1050px; margin: 0 auto; position: relative; z-index: 1; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- שורת פרופיל וארון גביעים --- */
        .profile-header {
            background: var(--glass-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 15px 25px; display: flex; align-items: center; gap: 20px;
            margin-bottom: 25px; box-shadow: var(--glass-shadow);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            flex-wrap: wrap;
        }
        .profile-pic-wrapper { position: relative; width: 85px; height: 85px; flex-shrink: 0; }
        .profile-img {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            border: 3px solid var(--accent-blue); background: rgba(15, 23, 42, 0.6);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3); transition: all 0.3s ease;
        }
        .profile-pic-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; cursor: pointer; transition: opacity 0.3s; color: white; font-size: 1.4rem;
        }
        .profile-pic-wrapper:hover .profile-pic-overlay { opacity: 1; }
        .random-avatar-btn {
            position: absolute; bottom: -5px; right: -5px;
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            border: none; border-radius: 50%; width: 32px; height: 32px;
            color: white; cursor: pointer; box-shadow: 0 4px 10px rgba(139, 92, 246, 0.4);
            display: flex; justify-content: center; align-items: center; font-size: 1rem;
            transition: transform 0.2s; z-index: 2;
        }
        .random-avatar-btn:hover { transform: scale(1.1) rotate(15deg); }

        .profile-text { display: flex; flex-direction: column; justify-content: center; flex: 1; }
        .profile-text .greeting { color: var(--text-muted); font-size: 1.05rem; font-weight: 600; margin-bottom: 2px;}
        .profile-text .user-name {
            color: white; font-size: 1.8rem; font-weight: 800;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px;
            letter-spacing: -0.5px;
        }
        .profile-text .user-name i { color: #f59e0b; animation: wave 2.5s infinite; transform-origin: bottom center; }
        @keyframes wave { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(20deg); } }

        /* כפתור התנתקות קטן בפרופיל */
        .logout-small-btn {
            margin-right: auto;
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }
        .logout-small-btn:hover {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        /* --- עיצוב הגיימיפיקציה (רמות וסטריקים) --- */
        .gaming-stats { display: flex; gap: 15px; margin-top: 8px; flex-wrap: wrap; }
        .stat-pill {
            background: rgba(0,0,0,0.4); padding: 6px 14px; border-radius: 20px;
            font-size: 0.95rem; font-weight: 700; display: flex; align-items: center; gap: 8px;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
            transition: all 0.3s ease; position: relative; overflow: hidden;
        }
        .stat-pill .fire { color: #f97316; filter: drop-shadow(0 0 5px rgba(249, 115, 22, 0.5)); }
        .stat-pill .star { color: #facc15; filter: drop-shadow(0 0 5px rgba(250, 204, 21, 0.5)); }

        @keyframes levelUpPulse {
            0% { transform: scale(1); box-shadow: inset 0 2px 5px rgba(0,0,0,0.5), 0 0 0 0 rgba(250, 204, 21, 0.7); }
            50% { transform: scale(1.1); box-shadow: inset 0 2px 5px rgba(0,0,0,0.5), 0 0 20px 10px rgba(250, 204, 21, 0); }
            100% { transform: scale(1); box-shadow: inset 0 2px 5px rgba(0,0,0,0.5), 0 0 0 0 rgba(250, 204, 21, 0); }
        }
        .level-up-effect {
            animation: levelUpPulse 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2 !important;
            border-color: #facc15 !important;
            color: #facc15 !important;
        }

        /* --- האנימציה של קפיצת ה-XP --- */
        @keyframes xpPop {
            0% { transform: scale(1); color: #f8fafc; text-shadow: none; }
            50% { transform: scale(1.4); color: #facc15; text-shadow: 0 0 10px rgba(250, 204, 21, 0.8); }
            100% { transform: scale(1); color: #f8fafc; text-shadow: none; }
        }
        .xp-pop-effect {
            animation: xpPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .level-progress-fill {
            position: absolute; top: 0; right: 0; height: 100%;
            background: linear-gradient(90deg, rgba(250, 204, 21, 0.25), rgba(245, 158, 11, 0.45));
            width: 0%; transition: width 1s cubic-bezier(0.16, 1, 0.3, 1); z-index: 0;
        }

        /* --- עיצוב המדליות --- */
        .badges-cabinet {
            display: flex; gap: 12px; background: rgba(0,0,0,0.3); padding: 12px 18px;
            border-radius: 15px; border: 1px solid rgba(255,255,255,0.05);
            align-items: center;
        }
        .badge-icon {
            font-size: 1.6rem; color: rgba(255,255,255,0.15); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: help; position: relative;
        }
        .badge-icon.unlocked { transform: scale(1.1); }
        .badge-icon.unlocked.first-blood { color: #ef4444; filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.6)); }
        .badge-icon.unlocked.goal-crusher { color: #10b981; filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.6)); }
        .badge-icon.unlocked.the-whale { color: #3b82f6; filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.6)); }
        .badge-icon.unlocked.master-coin { color: #f59e0b; filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.6)); }
        .badge-icon.unlocked.on-fire { color: #f97316; filter: drop-shadow(0 0 8px rgba(249, 115, 22, 0.6)); }

        @keyframes badgeUnlock {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.6) rotate(15deg); filter: brightness(1.5); }
            100% { transform: scale(1.1) rotate(0deg); filter: brightness(1); }
        }
        .badge-icon.just-unlocked { animation: badgeUnlock 1s ease forwards; z-index: 10; }

        .custom-alert {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-150px);
            background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(239, 68, 68, 0.3);
            border-bottom: 4px solid #ef4444; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(239, 68, 68, 0.2);
            backdrop-filter: blur(15px); border-radius: 14px; padding: 16px 20px;
            display: flex; align-items: center; gap: 15px; z-index: 9999;
            opacity: 0; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            min-width: 320px; max-width: 90vw;
        }
        .custom-alert.success { border-color: rgba(16, 185, 129, 0.3); border-bottom-color: #10b981; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(16, 185, 129, 0.2); }
        .custom-alert.badge-alert { border-color: rgba(245, 158, 11, 0.3); border-bottom-color: #f59e0b; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(245, 158, 11, 0.2); }
        .custom-alert.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .alert-icon { font-size: 2rem; }
        .custom-alert.success .alert-icon { color: #10b981; text-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }
        .custom-alert.badge-alert .alert-icon { color: #f59e0b; text-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
        .custom-alert:not(.success):not(.badge-alert) .alert-icon { color: #ef4444; text-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
        .alert-content { flex: 1; }
        .alert-title { color: white; font-weight: 800; font-size: 1.1rem; margin-bottom: 4px; }
        .alert-message { color: var(--text-muted); font-size: 0.95rem; line-height: 1.4; }
        .alert-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem; transition: color 0.2s; padding: 5px; }
        .alert-close:hover { color: white; }

        .confirm-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.8); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 10000; opacity: 0; pointer-events: none; transition: all 0.3s ease;
        }
        .confirm-overlay.show { opacity: 1; pointer-events: auto; }
        .confirm-modal {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); padding: 30px; border-radius: 20px;
            text-align: center; max-width: 90%; width: 350px;
            transform: translateY(30px) scale(0.95); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .confirm-overlay.show .confirm-modal { transform: translateY(0) scale(1); }
        .confirm-icon { font-size: 3rem; color: #f59e0b; margin-bottom: 15px; text-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
        .confirm-title { color: white; font-size: 1.3rem; margin: 0 0 10px 0; font-weight: 800; }
        .confirm-message { color: var(--text-muted); margin: 0 0 25px 0; font-size: 1rem; line-height: 1.4;}
        .confirm-actions { display: flex; gap: 15px; }
        .btn-cancel, .btn-danger {
            flex: 1; padding: 12px; border: none; border-radius: 10px;
            font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s;
        }
        .btn-cancel { background: rgba(255,255,255,0.1); color: white; }
        .btn-cancel:hover { background: rgba(255,255,255,0.2); }
        .btn-danger { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(239, 68, 68, 0.5); filter: brightness(1.1); }
        .btn-danger:active { transform: translateY(1px) scale(0.98); }

        .header { text-align: center; margin-bottom: 30px; animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .header h1 { margin: 0; font-size: 2.2rem; color: #ffffff; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.5); letter-spacing: -0.5px;}
        .credit { color: var(--text-muted); font-size: 1.1rem; margin-top: 5px; margin-bottom: 0; font-weight: 600; }

        .top-controls { display: flex; justify-content: center; gap: 10px; margin-top: 20px; flex-wrap: wrap;}
        .control-box {
            background: var(--glass-bg); backdrop-filter: blur(10px); padding: 10px 20px;
            border-radius: 12px; display: flex; align-items: center; gap: 10px;
            border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
            transition: transform 0.3s ease, border-color 0.3s ease;
            flex: 1; min-width: 150px;
        }
        .control-box:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.2); }
        .control-box i { color: var(--text-muted); font-size: 1.2rem; }

        .control-box select {
            border: none; background-color: transparent; font-family: inherit; font-size: 1.15rem;
            font-weight: 600; color: var(--text-main); outline: none; cursor: pointer; width: 100%;
        }
        select option { background: #1e293b; color: #f8fafc; }

        .export-btn {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white;
            border: 1px solid rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 12px;
            font-weight: 700; font-size: 1.15rem;
            cursor: pointer; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.3s ease;
            flex: 1; min-width: 100px;
        }
        .export-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 20px rgba(37, 99, 235, 0.5); filter: brightness(1.1); }
        .export-btn:active { transform: translateY(1px) scale(0.98); }

        .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .card {
            background: var(--glass-bg); backdrop-filter: blur(10px); padding: 20px 15px;
            border-radius: 16px; box-shadow: var(--glass-shadow); text-align: center;
            border: 1px solid var(--glass-border); opacity: 0; animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden;
        }
        .dashboard .card:nth-child(1) { animation-delay: 0.1s; }
        .dashboard .card:nth-child(2) { animation-delay: 0.2s; }
        .dashboard .card:nth-child(3) { animation-delay: 0.3s; }
        .dashboard .card:nth-child(4) { animation-delay: 0.4s; }

        .card:hover { transform: translateY(-8px) scale(1.02); border-color: rgba(255,255,255,0.3); }
        .card.main-card:hover { box-shadow: 0 15px 30px rgba(30, 64, 175, 0.4), inset 0 0 20px rgba(255,255,255,0.05); }
        .card.savings-card:hover { box-shadow: 0 15px 30px rgba(67, 56, 202, 0.4), inset 0 0 20px rgba(255,255,255,0.05); }
        .card:nth-child(3):hover { box-shadow: 0 15px 30px rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.3); }
        .card:nth-child(4):hover { box-shadow: 0 15px 30px rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); }

        .card i { font-size: 1.8rem; margin-bottom: 10px; opacity: 0.9; transition: transform 0.3s ease; }
        .card:hover i { transform: scale(1.15) rotate(5deg); }

        .card.main-card { background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%); color: white; }
        .card.savings-card { background: linear-gradient(135deg, #312e81 0%, #4338ca 100%); color: white; }
        .card h3 { margin: 0 0 8px 0; font-size: 0.95rem; font-weight: 600; color: var(--text-muted);}
        .card.main-card h3, .card.savings-card h3 { color: rgba(255,255,255,0.8); }
        .card p { margin: 0; font-size: 1.6rem; font-weight: 800; color: var(--text-main); }

        .main-content { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 20px;}

        .panel {
            background: var(--glass-bg); backdrop-filter: blur(10px); padding: 20px;
            border-radius: 20px; box-shadow: var(--glass-shadow); border: 1px solid var(--glass-border);
            opacity: 0; animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: 0.3s;
        }
        .panel h2 { margin-top: 0; font-size: 1.2rem; color: var(--text-main); margin-bottom: 20px; display: flex; align-items: center; gap: 10px;}
        .panel h2 i { color: var(--accent-blue); text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }

        .form-row { display: flex; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 140px; position: relative; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; color: var(--text-muted); }

        input, select {
            width: 100%; padding: 12px 14px; border: 1px solid rgba(255,255,255,0.1);
            background-color: rgba(15, 23, 42, 0.6); border-radius: 10px; box-sizing: border-box;
            font-family: inherit; font-size: 1rem; color: var(--text-main); transition: all 0.3s ease;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent-blue); background-color: rgba(15, 23, 42, 0.9); box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); transform: translateY(-2px); }

        select {
            appearance: none; -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: left 16px center;
            background-size: 16px; padding-left: 40px; cursor: pointer;
        }

        .custom-date-picker-wrapper { position: relative; width: 100%; }
        .date-trigger {
            width: 100%; padding: 12px 14px; border: 1px solid rgba(255,255,255,0.1);
            background-color: rgba(15, 23, 42, 0.6); border-radius: 10px; box-sizing: border-box;
            font-family: inherit; font-size: 1rem; color: var(--text-main); cursor: pointer;
            transition: all 0.3s ease; display: flex; align-items: center; gap: 10px;
        }
        .date-trigger:hover { border-color: var(--accent-blue); background-color: rgba(15, 23, 42, 0.9); }
        .date-trigger i { color: var(--text-muted); }
        .date-dropdown {
            position: absolute; top: calc(100% + 5px); right: 0; min-width: 280px; width: 100%; max-width: 100vw;
            background: rgba(15, 23, 42, 0.95); border: 1px solid var(--accent-blue);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6); border-radius: 12px; backdrop-filter: blur(15px);
            z-index: 100; opacity: 0; pointer-events: none; transform: translateY(-10px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); padding: 15px; box-sizing: border-box;
        }
        .date-dropdown.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .no-date-btn {
            width: 100%; padding: 12px; background: rgba(59, 130, 246, 0.15); border: 1px dashed var(--accent-blue);
            color: #93c5fd; border-radius: 8px; font-weight: 700; cursor: pointer; transition: all 0.2s;
            margin-bottom: 15px; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 1rem;
        }
        .no-date-btn:hover { background: rgba(59, 130, 246, 0.3); color: white; }
        .months-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-height: 240px; overflow-y: auto; padding-right: 5px;
        }
        .months-grid::-webkit-scrollbar { width: 4px; }
        .months-grid::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 10px; }
        .months-grid::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 10px; }

        .month-option {
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main); border-radius: 12px; cursor: pointer;
            transition: all 0.3s ease; text-align: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            aspect-ratio: 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            padding: 5px;
        }
        .month-option:hover {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); border-color: #3b82f6;
            color: white; transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }
        .month-name { font-size: 1.1rem; font-weight: 800; margin-bottom: 2px; }
        .month-year { font-size: 0.85rem; color: rgba(255,255,255,0.6); transition: color 0.3s; }
        .month-option:hover .month-year { color: rgba(255,255,255,0.9); }

        button.submit-btn {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: 800;
            cursor: pointer; margin-top: 5px; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2);
        }
        button.submit-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4); filter: brightness(1.1); }
        button.submit-btn:active { transform: translateY(1px) scale(0.98); }

        .finish-goal-btn {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white; border: none; border-radius: 10px; font-size: 1.05rem; font-weight: 800;
            cursor: pointer; margin-top: 15px; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .finish-goal-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(245, 158, 11, 0.5); filter: brightness(1.1); }
        .finish-goal-btn:active { transform: translateY(1px) scale(0.98); }

        .search-bar-wrapper { position: relative; margin-bottom: 15px; }
        .search-bar-wrapper i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); transition: color 0.3s; }
        .search-bar-wrapper:focus-within i { color: var(--accent-blue); }
        .search-bar { width: 100%; padding: 12px 40px 12px 14px; }

        .list { list-style: none; padding: 0; margin: 0; max-height: 350px; overflow-y: auto; scroll-behavior: smooth;}
        .list::-webkit-scrollbar { width: 6px; }
        .list::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 10px; }
        .list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .list::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        .list li {
            background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255,255,255,0.05);
            border-right: 4px solid #475569; margin-bottom: 10px; padding: 12px 15px;
            display: flex; justify-content: space-between; border-radius: 10px; align-items: center;
            transition: all 0.3s ease; animation: fadeUp 0.4s ease-out forwards;
        }
        .list li:hover { transform: translateX(-5px); background: rgba(30, 41, 59, 0.8); border-color: rgba(255,255,255,0.1); }

        .list li.income { border-right-color: #34d399; }
        .list li.expense { border-right-color: #f87171; }
        .list li.savings { border-right-color: #a78bfa; }
        .list li.withdrawal { border-right-color: #3b82f6; }

        .details { display: flex; flex-direction: column; gap: 3px; }
        .details strong { font-size: 1rem; color: var(--text-main); }
        .details span.date { font-size: 0.75rem; color: var(--text-muted); }
        .details span.category { font-size: 0.75rem; color: #cbd5e1; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 15px; width: fit-content; }

        .amount-controls { display: flex; align-items: center; gap: 10px; }
        .amount-controls span { font-weight: 800; font-size: 1.05rem; }
        .list li.income .amount-controls span { color: #34d399; text-shadow: 0 0 10px rgba(52, 211, 153, 0.2); }
        .list li.expense .amount-controls span { color: #f87171; text-shadow: 0 0 10px rgba(248, 113, 113, 0.2); }
        .list li.savings .amount-controls span { color: #a78bfa; text-shadow: 0 0 10px rgba(167, 139, 250, 0.2); }
        .list li.withdrawal .amount-controls span { color: #93c5fd; text-shadow: 0 0 10px rgba(147, 197, 253, 0.2); }

        .delete-btn {
            background: rgba(239, 68, 68, 0.1); color: #fca5a5; border: none; width: 28px; height: 28px;
            border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;
        }
        .delete-btn:hover { background: rgba(239, 68, 68, 0.3); color: #fff; transform: scale(1.1); }

        /* כפתור הפקדה מהירה */
        .quick-deposit-btn {
            background: rgba(16, 185, 129, 0.1); color: #34d399; border: none; width: 28px; height: 28px;
            border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;
        }
        .quick-deposit-btn:hover { background: rgba(16, 185, 129, 0.3); color: #fff; transform: scale(1.1); }

        .chart-container { position: relative; height: 220px; width: 100%; margin-top: 15px;}
        .empty-state { text-align: center; color: var(--text-muted); padding: 20px 0; font-size: 1rem;}

        .smart-goals-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 20px;}
        .smart-goal-card {
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.05); padding: 20px;
            border-radius: 16px; position: relative; transition: all 0.3s ease; animation: fadeUp 0.5s ease forwards;
            display: flex; flex-direction: column;
        }
        .smart-goal-card:hover { transform: translateY(-5px); border-color: rgba(139, 92, 246, 0.3); box-shadow: 0 10px 25px rgba(139, 92, 246, 0.15); }

        .goal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .goal-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
        .goal-target-date { font-size: 0.85rem; color: var(--text-muted); margin-top: 3px; }

        .progress-bar-bg { background: rgba(255,255,255,0.1); height: 10px; border-radius: 5px; margin-bottom: 10px; overflow: hidden;}
        .progress-bar-fill { background: linear-gradient(90deg, #a78bfa, #3b82f6); height: 100%; border-radius: 5px; width: 0%; transition: width 1.5s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 0 10px rgba(139, 92, 246, 0.5); }
        .goal-stats { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 10px;}
        .goal-saved { color: var(--text-main); font-weight: 700;}
        .goal-target { color: var(--text-muted); }
        .monthly-recommendation { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); color: #34d399; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; text-align: center; font-weight: 600; margin-bottom: auto;}

        .add-goal-form { background: rgba(255,255,255,0.02); padding: 15px; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.1); margin-bottom: 20px;}
        .add-goal-form h3 { margin: 0 0 15px 0; font-size: 1rem; color: var(--text-muted); }

        @media (max-width: 768px) {
            .profile-header { padding: 15px; flex-direction: column; align-items: flex-start;}
            .logout-small-btn { position: static; margin-top: 10px; width: 100%; justify-content: center; }
            .badges-cabinet { margin-top: 10px; width: 100%; justify-content: center; }
            .profile-pic-wrapper { width: 60px; height: 60px; }
            .profile-text .user-name { font-size: 1.4rem; }

            .top-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
            .top-controls .control-box, .top-controls .export-btn { width: 100%; justify-content: center; }
            .dashboard { grid-template-columns: 1fr 1fr; }
            .form-row { flex-direction: column; gap: 15px; }
            .form-group { width: 100%; max-width: 100% !important; }
            .list li { flex-direction: column; align-items: flex-start; gap: 12px; }
            .amount-controls { width: 100%; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
            .amount-controls span { font-size: 1.2rem; }
            .smart-goals-container { grid-template-columns: 1fr; }
        }

        @media (min-width: 900px) {
            .main-content { grid-template-columns: 1.3fr 1fr; }
            body { padding: 40px 15px; }
            .dashboard { grid-template-columns: repeat(4, 1fr); }
            .card p { font-size: 2.3rem; }
        }
    </style>
</head>
<body>

<div id="custom-alert" class="custom-alert">
    <div id="alert-icon-wrapper" class="alert-icon"><i id="alert-icon-class" class="fas fa-exclamation-circle"></i></div>
    <div class="alert-content">
        <div id="alert-title" class="alert-title">שגיאה</div>
        <div id="alert-message" class="alert-message">הודעת שגיאה כללית</div>
    </div>
    <button class="alert-close" onclick="closeCustomAlert()"><i class="fas fa-times"></i></button>
</div>

<div id="confirm-overlay" class="confirm-overlay">
    <div class="confirm-modal">
        <div class="confirm-icon"><i class="fas fa-trash-alt"></i></div>
        <h3 id="confirm-title" class="confirm-title">אישור פעולה</h3>
        <p id="confirm-message" class="confirm-message">האם אתה בטוח שברצונך למחוק?</p>
        <div class="confirm-actions">
            <button id="confirm-cancel" class="btn-cancel">ביטול</button>
            <button id="confirm-ok" class="btn-danger">כן, מחק</button>
        </div>
    </div>
</div>

<!-- המודל החדש של ההפקדה המהירה -->
<div id="quick-deposit-overlay" class="confirm-overlay">
    <div class="confirm-modal">
        <div class="confirm-icon" style="color: #10b981; text-shadow: 0 0 15px rgba(16, 185, 129, 0.4);"><i class="fas fa-piggy-bank"></i></div>
        <h3 class="confirm-title">הפקדה מהירה ליעד</h3>
        <p class="confirm-message" id="quick-deposit-goal-name"></p>
        <input type="text" id="quick-deposit-amount" placeholder="סכום להפקדה" inputmode="decimal" style="width: 100%; margin-bottom: 20px; text-align: center; font-size: 1.2rem; font-weight: bold;">
        <div class="confirm-actions">
            <button class="btn-cancel" onclick="closeQuickDeposit()">ביטול</button>
            <button class="btn-success" onclick="submitQuickDeposit()" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);">הפקד כעת</button>
        </div>
    </div>
</div>

<div class="container">

    <div class="profile-header">
        <div class="profile-pic-wrapper">
            <img id="profile-img" class="profile-img" src="" alt="תמונת פרופיל">
            <div class="profile-pic-overlay" onclick="document.getElementById('profile-upload').click()" title="העלה תמונה אישית">
                <i class="fas fa-camera"></i>
            </div>
            <input type="file" id="profile-upload" accept="image/*" style="display: none;" onchange="handleProfileUpload(event)">
            <button type="button" class="random-avatar-btn" onclick="generateRandomAvatar()" title="הגרל דמות אקראית">
                <i class="fas fa-dice"></i>
            </button>
        </div>
        <div class="profile-text">
            <div class="greeting">ברוך שובך לאתר,</div>
            <div class="user-name" id="user-name-display">טוען... <i class="fas fa-hand-sparkles"></i></div>

            <div class="gaming-stats">
                <div class="stat-pill" title="רצף ימים שנכנסת למערכת">
                    <i class="fas fa-fire fire"></i> <span id="streak-counter">0 ימים</span>
                </div>
                <div style="flex:1; min-width: 120px;">
                    <div class="stat-pill" style="position: relative; overflow: hidden; justify-content: space-between;" title="רמת משתמש (הוסף פעולות כדי לעלות רמה)">
                        <div class="level-progress-fill" id="level-progress"></div>
                        <div style="position: relative; z-index: 1; display: flex; align-items: center; gap: 8px;"><i class="fas fa-star star"></i> <span>רמה <span id="level-counter">1</span></span></div>
                        <span style="font-size: 0.85rem; color: #f8fafc; position: relative; z-index: 1; font-weight: 800; display: inline-block; transition: all 0.3s ease;" id="xp-text">0/100 XP</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="badges-cabinet" id="badges-cabinet"></div>

        <!-- כפתור ההתנתקות החדש והמעוצב -->
        <a href="/logout" onclick="localStorage.removeItem('budgetAppUsername');" class="logout-small-btn" title="התנתק מהחשבון">
            <i class="fas fa-sign-out-alt"></i> התנתק
        </a>
    </div>

    <div class="header">
        <div class="top-controls">
            <div class="control-box">
                <i class="fas fa-coins"></i>
                <select id="currency-selector" onchange="changeCurrency()">
                    <option value="ILS">₪ שקלים</option>
                    <option value="USD">$ דולרים</option>
                </select>
            </div>
            <div class="control-box">
                <i class="fas fa-calendar-alt"></i>
                <select id="month-filter" onchange="renderUI()"></select>
            </div>
            <button class="export-btn" onclick="exportToCSV()">
                <i class="fas fa-file-excel"></i> ייצוא
            </button>
        </div>
    </div>

    <div class="dashboard">
        <div class="card main-card">
            <i class="fas fa-wallet" style="color: #93c5fd;"></i>
            <h3>עו"ש</h3>
            <p id="balance" contenteditable="true" onblur="updateManualBalance(this.innerText)" title="לחץ לעריכה ישירה של העו&quot;ש" style="cursor: pointer; border-bottom: 1px dashed rgba(255,255,255,0.4); outline: none;">0</p>
        </div>
        <div class="card savings-card">
            <i class="fas fa-vault" style="color: #c4b5fd;"></i>
            <h3>סך חיסכון</h3>
            <p id="savings-total" data-val="0">0</p>
        </div>
        <div class="card">
            <i class="fas fa-arrow-trend-up income-icon" style="color: #34d399;"></i>
            <h3>הכנסות</h3>
            <p id="income" style="color: #34d399;" data-val="0">0</p>
        </div>
        <div class="card">
            <i class="fas fa-arrow-trend-down expense-icon" style="color: #f87171;"></i>
            <h3>הוצאות</h3>
            <p id="expense" style="color: #f87171;" data-val="0">0</p>
        </div>
    </div>

    <div class="panel" style="position: relative; z-index: 50;">
        <h2><i class="fas fa-bullseye"></i> יעדים חכמים</h2>

        <div class="add-goal-form">
            <h3>הגדרת יעד חדש</h3>
            <form id="goal-form" class="form-row" style="margin-bottom: 0;">
                <div class="form-group" style="flex: 2;">
                    <input type="text" id="goal-name" placeholder="לדוגמה: רישיון ואופנוע A1..." required>
                </div>
                <div class="form-group">
                    <input type="text" id="goal-amount" placeholder="סכום יעד" required inputmode="decimal">
                </div>

                <div class="form-group custom-date-picker-wrapper" id="date-picker-wrapper">
                    <div class="date-trigger" id="date-trigger" onclick="toggleDatePicker()">
                        <i class="fas fa-calendar-alt"></i>
                        <span id="date-trigger-text">תאריך יעד (אופציונלי)</span>
                    </div>
                    <div class="date-dropdown" id="date-dropdown">
                        <button type="button" class="no-date-btn" onclick="selectDate('', 'ללא תאריך (יעד פתוח)')">
                            <i class="fas fa-infinity"></i> ללא תאריך (יעד פתוח)
                        </button>
                        <div class="months-grid" id="months-grid"></div>
                    </div>
                    <input type="hidden" id="goal-date" value="">
                </div>

                <div class="form-group" style="min-width: 60px; max-width: 60px;">
                    <button type="submit" class="submit-btn" style="margin-top: 0; height: 100%; padding: 0; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);"><i class="fas fa-plus"></i></button>
                </div>
            </form>
        </div>

        <div class="smart-goals-container" id="goals-container"></div>
    </div>

    <div class="main-content">
        <div>
            <div class="panel">
                <h2><i class="fas fa-plus-circle"></i> הוספת פעולה</h2>
                <form id="form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="type">סוג</label>
                            <select id="type" onchange="handleTypeChange()">
                                <option value="expense">הוצאה</option>
                                <option value="income">הכנסה</option>
                                <option value="savings">הפקדה לחיסכון</option>
                                <option value="withdrawal">משיכה מחיסכון</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="category">קטגוריה / יעד</label>
                            <select id="category"></select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="text">תיאור</label>
                            <input type="text" id="text" placeholder="פירוט..." required>
                        </div>
                        <div class="form-group">
                            <label for="amount">סכום</label>
                            <input type="text" id="amount" placeholder="0" required inputmode="decimal">
                        </div>
                    </div>
                    <button type="submit" class="submit-btn"><i class="fas fa-check"></i> הוסף</button>
                </form>
            </div>

            <div class="panel" style="margin-top: 20px;">
                <h2><i class="fas fa-chart-pie"></i> התפלגות הוצאות</h2>
                <div class="chart-container">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </div>

        <div class="panel">
            <h2><i class="fas fa-list"></i> היסטוריה</h2>
            <div class="search-bar-wrapper">
                <input type="text" id="search-input" class="search-bar" placeholder="חפש לפי תיאור או תאריך (למשל 13.08)..." onkeyup="renderUI()">
                <i class="fas fa-search"></i>
            </div>
            <ul id="list" class="list"></ul>
        </div>
    </div>
</div>

<script>
    function createBackgroundIcons() {
        const bgContainer = document.createElement('div');
        bgContainer.className = 'floating-bg-icons';
        document.body.appendChild(bgContainer);

        const icons = ['fa-coins', 'fa-wallet', 'fa-chart-line', 'fa-piggy-bank', 'fa-credit-card', 'fa-money-bill-wave', 'fa-sack-dollar', 'fa-vault', 'fa-file-invoice-dollar', 'fa-chart-pie'];
        for (let i = 0; i < 22; i++) {
            const icon = document.createElement('i');
            icon.className = `fas ${icons[Math.floor(Math.random() * icons.length)]}`;
            const size = Math.random() * 100 + 80;
            let left, top;
            const region = Math.random();
            if (region < 0.4) { left = Math.random() * 20; top = Math.random() * 100; }
            else if (region < 0.8) { left = 80 + Math.random() * 20; top = Math.random() * 100; }
            else if (region < 0.9) { left = Math.random() * 100; top = Math.random() * 15; }
            else { left = Math.random() * 100; top = 85 + Math.random() * 15; }
            const duration = Math.random() * 40 + 60;
            const delay = Math.random() * 20;
            const opacity = Math.random() * 0.02 + 0.015;
            icon.style.cssText = `position: absolute; left: ${left}%; top: ${top}%; font-size: ${size}px; color: rgba(147, 197, 253, ${opacity}); animation: float-finance-icon ${duration}s infinite ease-in-out; animation-delay: -${delay}s;`;
            bgContainer.appendChild(icon);
        }
    }
    createBackgroundIcons();

    const API_URL = '/api/transactions';
    const GOALS_API_URL = '/api/goals';
    const ACCOUNT_API_URL = '/api/account';

    let currentUsername = localStorage.getItem('budgetAppUsername') || 'אורח';
    let profileData = {
        profilePic: '',
        xp: 0,
        streak: 0,
        lastLogin: '',
        badges: []
    };

    if (currentUsername !== 'אורח') {
        const localData = localStorage.getItem('budgetAppProfileData_' + currentUsername);
        if (localData) {
            profileData = JSON.parse(localData);
        }
    }

    function loadProfileUI() {
        document.getElementById('user-name-display').innerHTML = `${currentUsername} <i class="fas fa-hand-sparkles"></i>`;

        if (profileData.profilePic) {
            document.getElementById('profile-img').src = profileData.profilePic;
        } else {
            document.getElementById('profile-img').src = `https://api.dicebear.com/7.x/adventurer/svg?seed=${currentUsername}`;
        }

        const currentLevel = Math.floor((profileData.xp || 0) / 100) + 1;
        const xpIntoLevel = (profileData.xp || 0) % 100;
        document.getElementById('streak-counter').innerText = `${profileData.streak || 0} ימים`;
        document.getElementById('level-counter').innerText = currentLevel;
        document.getElementById('xp-text').innerText = `${xpIntoLevel}/100 XP`;
        setTimeout(() => {
            const progress = document.getElementById('level-progress');
            if (progress) progress.style.width = `${xpIntoLevel}%`;
        }, 300);
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadProfileUI();
    });

    async function saveProfileData() {
        if(currentUsername === 'אורח' || currentUsername.includes('טוען')) return;
        localStorage.setItem('budgetAppProfileData_' + currentUsername, JSON.stringify(profileData));
        try {
            await fetch('/api/account/profile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(profileData)
            });
        } catch(e) {}
    }

    function generateRandomAvatar() {
        const seed = Math.random().toString(36).substring(7);
        profileData.profilePic = `https://api.dicebear.com/7.x/adventurer/svg?seed=${seed}`;
        loadProfileUI();
        saveProfileData();
    }

    function handleProfileUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                profileData.profilePic = e.target.result;
                loadProfileUI();
                saveProfileData();
            };
            reader.readAsDataURL(file);
        }
    }

    const incomeSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3');
    const expenseSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
    const savingsSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3');
    const goalSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3');
    const errorSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3');
    const deleteSound = new Audio('https://assets.mixkit.co/active_storage/sfx/3005/3005-preview.mp3');

    function updateGamingStats(addXP = 0) {
        if (currentUsername === 'אורח' || currentUsername.includes('טוען')) return;

        const oldLevel = Math.floor((profileData.xp || 0) / 100) + 1;
        let xpGained = false;

        if (addXP > 0) {
            profileData.xp = (profileData.xp || 0) + addXP;
            saveProfileData();
            xpGained = true;
        }

        const todayStr = new Date().toISOString().split('T')[0];
        if (profileData.lastLogin !== todayStr && addXP === 0) { // תופס רק את הכניסה היומית מהשרת או בריענון
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            const yesterdayStr = yesterday.toISOString().split('T')[0];

            if (profileData.lastLogin === yesterdayStr) {
                profileData.streak = (profileData.streak || 0) + 1;
            } else {
                profileData.streak = 1;
            }
            profileData.xp = (profileData.xp || 0) + 20;
            profileData.lastLogin = todayStr;
            xpGained = true;
            saveProfileData();
        }

        const currentLevel = Math.floor((profileData.xp || 0) / 100) + 1;
        const xpIntoLevel = (profileData.xp || 0) % 100;

        if (currentLevel > oldLevel) {
            jackpotSound.currentTime = 0;
            jackpotSound.play().catch(e => {});
            showCustomAlert('רמה חדשה!', `כל הכבוד! עלית לרמה ${currentLevel} 🚀`, true);

            const levelDiv = document.getElementById('level-counter').closest('.stat-pill');
            if (levelDiv) {
                levelDiv.classList.add('level-up-effect');
                setTimeout(() => levelDiv.classList.remove('level-up-effect'), 2000);
            }
            triggerConfetti();
        }

        document.getElementById('streak-counter').innerText = `${profileData.streak || 0} ימים`;
        document.getElementById('level-counter').innerText = currentLevel;
        document.getElementById('xp-text').innerText = `${xpIntoLevel}/100 XP`;

        // הפעלת האנימציה של ה-XP
        if (xpGained) {
            const xpTextEl = document.getElementById('xp-text');
            if (xpTextEl) {
                xpTextEl.classList.remove('xp-pop-effect');
                void xpTextEl.offsetWidth; // מאלץ את הדפדפן להתחיל את האנימציה מחדש
                xpTextEl.classList.add('xp-pop-effect');
            }
        }

        setTimeout(() => {
            const progress = document.getElementById('level-progress');
            if (progress) progress.style.width = `${xpIntoLevel}%`;
        }, 300);
    }

    function checkMasterCoin() {
        const months = {};
        transactions.forEach(t => {
            const m = t.date.substring(0, 7);
            if (!months[m]) months[m] = { inc: 0, exp: 0 };
            if (t.type === 'income' && !t.category.startsWith('משיכה מ:')) months[m].inc += t.amount;
            if (t.type === 'expense') months[m].exp += t.amount;
        });
        for (let m in months) {
            if (months[m].inc > months[m].exp && months[m].exp > 0) return true;
        }
        return false;
    }

    function formatInputLive(e) {
        let input = e.target;
        let cursorPosition = input.selectionStart;
        let originalLength = input.value.length;

        let value = input.value.replace(/[^0-9.]/g, '');
        let parts = value.split('.');
        if (parts.length > 2) parts = [parts[0], parts.slice(1).join('')];
        if (parts[0]) {
            let num = parseInt(parts[0], 10);
            if (!isNaN(num)) parts[0] = num.toLocaleString('en-US');
            else parts[0] = '';
        }
        input.value = parts.join('.');

        let newLength = input.value.length;
        cursorPosition = cursorPosition + (newLength - originalLength);
        input.setSelectionRange(cursorPosition, cursorPosition);
    }

    document.getElementById('amount').addEventListener('input', formatInputLive);
    document.getElementById('goal-amount').addEventListener('input', formatInputLive);

    balanceUI.addEventListener('input', function(e) {
        let originalText = this.innerText;
        let isNegative = originalText.includes('-');
        let cleanVal = originalText.replace(/[^0-9.]/g, '');
        let parts = cleanVal.split('.');
        if (parts.length > 2) parts = [parts[0], parts.slice(1).join('')];
        if (parts[0]) {
            let num = parseInt(parts[0], 10);
            if (!isNaN(num)) parts[0] = num.toLocaleString('en-US');
            else parts[0] = '';
        }
        let finalVal = '';
        if (cleanVal === '' && isNegative) finalVal = '-';
        else finalVal = (isNegative ? '-' : '') + parts.join('.');

        if (originalText !== finalVal) {
            this.innerText = finalVal;
            try {
                let range = document.createRange();
                let sel = window.getSelection();
                range.selectNodeContents(this);
                range.collapse(false);
                sel.removeAllRanges();
                sel.addRange(range);
            } catch(err) {}
        }
    });

    function animateValue(obj, start, end, duration, playSound = false) {
        let startTimestamp = null;
        let lastTick = 0;
        const isCountingUp = end > start;

        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            if (playSound && progress < 1 && (timestamp - lastTick > 60)) {
                tickAudio.currentTime = 0; tickAudio.play().catch(e => {}); lastTick = timestamp;
            }
            const easeProgress = 1 - Math.pow(1 - progress, 4);
            const current = easeProgress * (end - start) + start;
            let sign = current < 0 ? '-' : '';
            obj.innerText = sign + currencySymbol + Math.abs(current).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

            if (progress < 1) {
                window.requestAnimationFrame(step);
            } else {
                let finalSign = end < 0 ? '-' : '';
                obj.innerText = finalSign + currencySymbol + Math.abs(end).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                if (playSound && isCountingUp && (end - start) > 0) {
                    incomeSound.currentTime = 0; incomeSound.play().catch(e => {});
                }
            }
        };
        window.requestAnimationFrame(step);
    }

    async function fetchBalance(animate = true, playSound = false) {
        try {
            const res = await fetch(ACCOUNT_API_URL);
            if(res.ok) {
                const acc = await res.json();
                let needServerSave = false;

                if (acc.username && currentUsername !== acc.username) {
                    currentUsername = acc.username;
                    localStorage.setItem('budgetAppUsername', currentUsername);
                    profileData = { profilePic: '', xp: 0, streak: 0, lastLogin: '', badges: [] };
                }

                // --- משיכת נתונים מהשרת והצבתם במקום הראשון ---
                if (acc.lastLogin) { // אם כבר יש למשתמש הזה נתונים בשרת
                    profileData.xp = acc.xp;
                    profileData.streak = acc.streak;
                    profileData.lastLogin = acc.lastLogin;
                } else {
                    // משתמש חדש לגמרי דנדש! נקודת פתיחה מדויקת
                    profileData.xp = 20;
                    profileData.streak = 1;
                    profileData.lastLogin = new Date().toISOString().split('T')[0];
                    needServerSave = true;
                }

                // בדיקת התחברות יומית ומתן בונוס מסונכרן (מטופל גם ב-updateGamingStats ליתר ביטחון, כאן נבדוק אם כדאי לשמור שוב)
                const todayStr = new Date().toISOString().split('T')[0];
                if (profileData.lastLogin !== todayStr) {
                    needServerSave = true;
                }

                // השרת קובע: איפוס מוחלט של הבאדג'ים אם אין בשרת!
                if (acc.badges) {
                    let serverBadges = acc.badges.split(',').filter(b => b !== '');
                    localStorage.setItem('budgetAppBadges_' + currentUsername, JSON.stringify(serverBadges));
                } else {
                    localStorage.setItem('budgetAppBadges_' + currentUsername, JSON.stringify([]));
                }

                if (acc.profilePic && acc.profilePic !== profileData.profilePic) {
                    profileData.profilePic = acc.profilePic;
                }

                // ציור הנתונים המסונכרנים אל המסך
                localStorage.setItem('budgetAppProfileData_' + currentUsername, JSON.stringify(profileData));
                loadProfileUI();
                updateGamingStats(0);

                if (needServerSave) {
                    saveProfileData();
                }

                let newBal = acc.balance || 0;
                let oldBal = currentBalanceAmount || 0;
                currentBalanceAmount = newBal;

                balanceUI.style.direction = 'ltr';
                balanceUI.style.display = 'inline-block';

                if (animate && oldBal !== newBal) {
                    animateValue(balanceUI, oldBal, newBal, 1500, playSound);
                } else {
                    let sign = newBal < 0 ? '-' : '';
                    balanceUI.innerText = sign + currencySymbol + Math.abs(newBal).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                }

                renderBadges();
            }
        } catch (e) { console.error(e); }
    }

        });
    }

    function handleTypeChange() {
        if(type.value === 'savings' || type.value === 'withdrawal') {
            if (smartGoals.length === 0) category.innerHTML = '<option value="" disabled selected>אין יעדים מוגדרים, צור יעד למעלה</option>';
            else category.innerHTML = smartGoals.map(g => `<option value="${g.name}">🎯 ${g.name}</option>`).join('');
        } else if (type.value === 'income') {
            category.innerHTML = `<option value="💰 משכורת">💰 משכורת</option><option value="🛵 משלוחים / טיפים">🛵 משלוחים / טיפים</option><option value="שונות">שונות</option>`;
        } else {
            category.innerHTML = `<option value="🎓 לימודים">🎓 לימודים</option><option value="🏍️ רכב / אופנוע">🏍️ רכב / אופנוע</option><option value="🛒 סופר">🛒 סופר</option><option value="🍔 מסעדות ואוכל">🍔 מסעדות ואוכל</option><option value="🎮 פנאי וגיימינג">🎮 פנאי וגיימינג</option><option value="📱 חשבונות">📱 חשבונות</option><option value="💡 שונות">💡 שונות</option>`;
        }
    }

    async function addTransaction(e) {
        e.preventDefault();
        const txTypeRaw = type.value;
        const txAmount = parseFloat(amount.value.replace(/,/g, ''));
        if (isNaN(txAmount) || txAmount <= 0) { showCustomAlert('שגיאה', 'נא להזין סכום תקין.', false); return; }

        if (txTypeRaw === 'withdrawal') {
            if (!category.value) { showCustomAlert('שגיאה ביעד', 'אנא בחר יעד חכם למשוך ממנו.', false); return; }
            const savedAmountRaw = transactions.filter(t => t.category === category.value && t.type === 'savings').reduce((acc, t) => acc + t.amount, 0);
            const withdrawAmount = transactions.filter(t => t.type === 'income' && t.category === 'משיכה מ: ' + category.value).reduce((acc, t) => acc + t.amount, 0);
            const currentSavedInGoal = savedAmountRaw - withdrawAmount;
            if (txAmount > currentSavedInGoal) { showCustomAlert('חריגה ממשיכה', `לא ניתן למשוך סכום זה.\nביעד "${category.value}" יש כרגע רק ${currencySymbol}${currentSavedInGoal.toLocaleString('en-US')}.`, false); return; }
        } else if (txTypeRaw === 'savings') {
            if (!category.value) { showCustomAlert('שגיאה ביעד', 'אנא צור יעד חיסכון קודם באזור "יעדים חכמים".', false); return; }
            if (txAmount > currentBalanceAmount) { showCustomAlert('חריגה מהתקציב', `אין מספיק כסף בעו"ש כדי להפקיד את הסכום הזה לחיסכון!\nהסכום המבוקש (${currencySymbol}${txAmount.toLocaleString('en-US')}) גדול מהיתרה הפנויה (${currencySymbol}${currentBalanceAmount.toLocaleString('en-US')}).`, false); return; }
        }

        let finalType = txTypeRaw; let finalCategory = category.value; let finalText = text.value;
        if (txTypeRaw === 'withdrawal') { finalType = 'income'; finalCategory = 'משיכה מ: ' + category.value; finalText = text.value || 'משיכה מחיסכון'; }

        const transaction = { type: finalType, text: finalText, category: finalCategory, amount: txAmount, date: new Date().toISOString().substring(0, 19) };

        try {
            const response = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(transaction) });
            if(response.ok) {
                const savedTx = await response.json();
                const isWithdrawalTx = savedTx.type === 'income' && savedTx.category.startsWith('משיכה מ: ');
                if (isWithdrawalTx || savedTx.type === 'income') incomeSound.play().catch(e => {});
                else if (savedTx.type === 'expense') expenseSound.play().catch(e => {});
                else if (savedTx.type === 'savings') savingsSound.play().catch(e => {});

                transactions.push(savedTx);
                text.value = ''; amount.value = '';
                populateMonthsDropdown(); renderUI();
                updateGamingStats(10);
                fetchBalance(true, true);
            }
        } catch (error) { console.error(error); }
    }

    function removeTransaction(id) {
        const txToDelete = transactions.find(t => t.id === id);
        if (txToDelete && txToDelete.type === 'savings') {
            const goalName = txToDelete.category;
            const remainingSavingsInGoal = transactions.filter(t => t.type === 'savings' && t.category === goalName && t.id !== id).reduce((acc, t) => acc + t.amount, 0);
            const totalWithdrawalsInGoal = transactions.filter(t => t.type === 'income' && t.category === 'משיכה מ: ' + goalName).reduce((acc, t) => acc + t.amount, 0);
            if (totalWithdrawalsInGoal > remainingSavingsInGoal) { showCustomAlert('שגיאת מחיקה', `לא ניתן למחוק הפקדה זו. כנסת את החיסכון למינוס.`, false); return; }
        }
        showCustomConfirm("מחיקת פעולה", "האם למחוק פעולה זו מההיסטוריה?", async () => {
            try {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if(response.ok) {
                    deleteSound.play().catch(e => {});
                    transactions = transactions.filter(t => t.id !== id);
                    populateMonthsDropdown(); renderUI(); fetchBalance(true, true);
                }
            } catch (error) { console.error(error); }
        });
    }

    function populateMonthsDropdown() {
        const months = new Set();
        transactions.forEach(t => { const d = new Date(t.date); months.add(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`); });
        const sortedMonths = Array.from(months).sort().reverse();
        const currentVal = monthFilter.value;
        monthFilter.innerHTML = '<option value="all">כל הזמן</option>';
        sortedMonths.forEach(m => {
            const [year, month] = m.split('-');
            const monthName = new Date(year, month - 1).toLocaleString('he-IL', { month: 'long', year: 'numeric' });
            monthFilter.innerHTML += `<option value="${m}">${monthName}</option>`;
        });
        if (currentVal && sortedMonths.includes(currentVal)) monthFilter.value = currentVal;
    }

    function renderUI() {
        list.innerHTML = '';
        const filterMonth = monthFilter.value || 'all';
        const searchTerm = searchInput.value.toLowerCase();
        const filteredTransactions = transactions.filter(t => {
            const d = new Date(t.date);
            const monthStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            const displayDateStr = d.toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', year: 'numeric' });
            return (filterMonth === 'all' || monthStr === filterMonth) && (t.text.toLowerCase().includes(searchTerm) || t.category.toLowerCase().includes(searchTerm) || displayDateStr.includes(searchTerm));
        });

        if (filteredTransactions.length === 0) list.innerHTML = '<li class="empty-state"><i class="fas fa-inbox"></i>אין תנועות</li>';
        else [...filteredTransactions].reverse().forEach((t, index) => addTransactionDOM(t, index));

        updateValues(filteredTransactions); updateChart(filteredTransactions); renderSmartGoals();
    }

    // הפונקציה ששודרגה עם כפתור ההפקדה המהירה ליעדים!
    function renderSmartGoals() {
        const container = document.getElementById('goals-container');
        container.innerHTML = '';
        if(smartGoals.length === 0) { container.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;">לא הוגדרו יעדים חכמים עדיין</div>'; return; }
        const savingsTxs = transactions.filter(t => t.type === 'savings');

        smartGoals.forEach(goal => {
            const savedAmountRaw = savingsTxs.filter(t => t.category === goal.name).reduce((acc, t) => acc + t.amount, 0);
            const withdrawAmount = transactions.filter(t => t.type === 'income' && t.category === 'משיכה מ: ' + goal.name).reduce((acc, t) => acc + t.amount, 0);
            const savedAmount = savedAmountRaw - withdrawAmount;
            const percentage = Math.min(100, goal.targetAmount > 0 ? (savedAmount / goal.targetAmount) * 100 : 0);
            let recommendationText = ""; let displayMonth = ""; let actionButton = "";
            let remainingToSave = Math.max(0, goal.targetAmount - savedAmount);

            if (remainingToSave === 0) {
                recommendationText = "🎉 היעד הושלם בהצלחה!";
                actionButton = `<button type="button" class="finish-goal-btn" onclick="finishGoal(${goal.id}, '${goal.name}')"><i class="fas fa-trophy"></i> סיום ומשיכת הכסף</button>`;
            } else {
                if (!goal.targetMonth || goal.targetMonth === "") {
                    displayMonth = "ללא תאריך (יעד פתוח)"; recommendationText = `חסרים עוד ${currencySymbol}${remainingToSave.toLocaleString('en-US', {maximumFractionDigits: 0})} להשלמת היעד`;
                } else {
                    const targetDate = new Date(goal.targetMonth + "-01");
                    displayMonth = targetDate.toLocaleString('he-IL', { month: 'long', year: 'numeric' });
                    const today = new Date();
                    let monthsLeft = (targetDate.getFullYear() - today.getFullYear()) * 12 + targetDate.getMonth() - today.getMonth();
                    if (monthsLeft <= 0) recommendationText = `הגעת לתאריך היעד! חסרים ${currencySymbol}${remainingToSave.toLocaleString('en-US', {maximumFractionDigits: 0})}`;
                    else recommendationText = `כדי לעמוד ביעד, הפרש השבוע/החודש: ${currencySymbol}${(remainingToSave / monthsLeft).toLocaleString('en-US', {maximumFractionDigits: 0})}`;
                }
            }

            const card = document.createElement('div'); card.className = 'smart-goal-card';

            // עיצוב מחדש של ה-Header של היעד כדי להכיל את ההפקדה המהירה
            card.innerHTML = `
                <div class="goal-header" style="align-items: center;">
                    <div>
                        <div class="goal-title">${goal.name}</div>
                        <div class="goal-target-date">יעד: ${displayMonth || 'הושלם!'}</div>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        ${remainingToSave > 0 ? `<button class="quick-deposit-btn" onclick="openQuickDeposit('${goal.name}')" title="הפקדה מהירה ליעד"><i class="fas fa-plus"></i></button>` : ''}
                        <button class="delete-btn" onclick="deleteSmartGoal(${goal.id})" title="מחק יעד (ללא השלמה)"><i class="fas fa-times"></i></button>
                    </div>
                </div>
                <div class="goal-stats">
                    <span class="goal-saved">${currencySymbol}${savedAmount.toLocaleString('en-US', {maximumFractionDigits: 0})}</span>
                    <span class="goal-target">מתוך ${currencySymbol}${goal.targetAmount.toLocaleString('en-US', {maximumFractionDigits: 0})}</span>
                </div>
                <div class="progress-bar-bg"><div class="progress-bar-fill"></div></div>
                <div class="monthly-recommendation">${recommendationText}</div>
                ${actionButton}`;

            container.appendChild(card);
            setTimeout(() => { const fill = card.querySelector('.progress-bar-fill'); if(fill) fill.style.width = `${percentage}%`; }, 100);
        });
    }

    function addTransactionDOM(transaction, index) {
        const isWithdrawal = transaction.type === 'income' && transaction.category.startsWith('משיכה מ: ');
        const displayType = isWithdrawal ? 'withdrawal' : transaction.type;
        let sign = displayType === 'income' ? '+' : displayType === 'withdrawal' ? '+' : displayType === 'expense' ? '-' : '→';
        const displayDate = new Date(transaction.date).toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', year: 'numeric' });
        const item = document.createElement('li'); item.classList.add(displayType); item.style.animationDelay = `${index * 0.05}s`;
        item.innerHTML = `<div class="details"><span class="date">${displayDate}</span><strong>${transaction.text}</strong><span class="category">${transaction.category}</span></div><div class="amount-controls"><span>${sign}${currencySymbol}${transaction.amount.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span><button class="delete-btn" onclick="removeTransaction(${transaction.id})"><i class="fas fa-trash-alt"></i></button></div>`;
        list.appendChild(item);
    }

    function updateValues(filteredData) {
        const incomeTotal = filteredData.filter(item => item.type === 'income' && !item.category.startsWith('משיכה מ: ')).reduce((acc, item) => acc + item.amount, 0);
        const expenseTotal = filteredData.filter(item => item.type === 'expense').reduce((acc, item) => acc + item.amount, 0);
        const savingsTotalRaw = filteredData.filter(item => item.type === 'savings').reduce((acc, item) => acc + item.amount, 0);
        const withdrawalsTotal = filteredData.filter(item => item.type === 'income' && item.category.startsWith('משיכה מ: ')).reduce((acc, item) => acc + item.amount, 0);
        const savingsTotal = savingsTotalRaw - withdrawalsTotal;

        const oldSavings = parseFloat(savingsTotalUI.getAttribute('data-val'));
        const oldIncome = parseFloat(income.getAttribute('data-val'));
        const oldExpense = parseFloat(expense.getAttribute('data-val'));

        animateValue(savingsTotalUI, oldSavings, savingsTotal, 1500, false);
        animateValue(income, oldIncome, incomeTotal, 1500, false);
        animateValue(expense, oldExpense, expenseTotal, 1500, false);

        savingsTotalUI.setAttribute('data-val', savingsTotal); income.setAttribute('data-val', incomeTotal); expense.setAttribute('data-val', expenseTotal);
    }

    function updateChart(filteredData) {
        const ctx = document.getElementById('expenseChart').getContext('2d');
        const expenses = filteredData.filter(t => t.type === 'expense');
        const categoryTotals = {};
        expenses.forEach(e => {
            const pureCatName = e.category.replace(/[^א-תa-zA-Z\s]/g, '').trim();
            categoryTotals[pureCatName] = (categoryTotals[pureCatName] || 0) + e.amount;
        });

        if (expenseChartInstance) { expenseChartInstance.destroy(); }
        if(Object.keys(categoryTotals).length === 0) return;

        expenseChartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: Object.keys(categoryTotals), datasets: [{ data: Object.values(categoryTotals), backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#f97316', '#ec4899'], borderWidth: 0 }] },
            options: { responsive: true, maintainAspectRatio: false, animation: { animateScale: true, animateRotate: true, duration: 1500, easing: 'easeOutQuart' }, plugins: { legend: { position: 'bottom', rtl: true, labels: { color: '#cbd5e1', font: { family: 'Assistant', size: 12 } } }, tooltip: { callbacks: { label: function(context) { let label = context.label || ''; if (label) label += ': '; const value = context.parsed; const total = context.dataset.data.reduce((acc, curr) => acc + curr, 0); const percentage = ((value / total) * 100).toFixed(1) + '%'; label += currencySymbol + value.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}); label += ' (' + percentage + ')'; return label; } } } }, cutout: '65%' }
        });
    }

    function exportToCSV() {
        if (transactions.length === 0) { showCustomAlert('ייצוא נכשל', 'אין נתונים לייצוא לקובץ.', false); return; }
        let csvContent = "data:text/csv;charset=utf-8,\uFEFFתאריך,סוג,קטגוריה,תיאור,סכום\n";
        transactions.forEach(t => {
            const date = new Date(t.date).toLocaleDateString('he-IL');
            const isWithdrawal = t.type === 'income' && t.category.startsWith('משיכה מ: ');
            const typeLabel = isWithdrawal ? 'משיכה מחיסכון' : t.type === 'income' ? 'הכנסה' : t.type === 'expense' ? 'הוצאה' : 'חיסכון';
            let catLabel = t.category; if (isWithdrawal) catLabel = catLabel.replace('משיכה מ: ', '');
            csvContent += `"${date}","${typeLabel}","${catLabel}","${t.text}","${t.amount}"\n`;
        });
        const link = document.createElement("a"); link.href = encodeURI(csvContent); link.download = "budget_data.csv"; document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }

    function triggerConfetti() {
        const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'];
        for (let i = 0; i < 80; i++) {
            const confetti = document.createElement('div');
            confetti.style.position = 'fixed';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.top = '-10px';
            confetti.style.width = Math.random() * 8 + 6 + 'px';
            confetti.style.height = Math.random() * 12 + 8 + 'px';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.zIndex = '99999';
            confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            confetti.style.pointerEvents = 'none';
            document.body.appendChild(confetti);

            const duration = Math.random() * 1500 + 1500;
            const animation = confetti.animate([
                { transform: `translate3d(0,0,0) rotate(0deg)`, opacity: 1 },
                { transform: `translate3d(${Math.random()*300 - 150}px, 100vh, 0) rotate(${Math.random()*1000}deg)`, opacity: 0 }
            ], {
                duration: duration,
                easing: 'cubic-bezier(.37,0,.63,1)'
            });

            animation.onfinish = () => confetti.remove();
        }
    }

    goalForm.addEventListener('submit', addSmartGoal);
    form.addEventListener('submit', addTransaction);

    fetchData();
</script>
</body>
</html>
