<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>התחברות | ניב אגוז</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background: radial-gradient(circle at center, #1e293b, #0f172a, #020617);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        /* אנימציות רקע - כדורים זוהרים */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: float 10s infinite alternate ease-in-out;
            pointer-events: none;
        }
        .orb-1 { width: 300px; height: 300px; background: rgba(59, 130, 246, 0.18); top: -80px; right: -50px; }
        .orb-2 { width: 350px; height: 350px; background: rgba(139, 92, 246, 0.18); bottom: -100px; left: -80px; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(20px, 35px) scale(1.08); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 25px;
            border-radius: 24px;
            box-shadow: var(--glass-shadow);
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
        }

        .icon-wrapper {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            margin: 0 auto 15px auto;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
        }

        h1 { margin: 0 0 5px 0; font-size: 2rem; font-weight: 800; letter-spacing: -0.5px;}
        p.subtitle { color: var(--text-muted); margin: 0 0 30px 0; font-size: 1rem; font-weight: 600; }

        .input-group {
            position: relative;
            margin-bottom: 18px;
            text-align: right;
        }

        .input-group i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            transition: color 0.3s, transform 0.3s;
            font-size: 1.1rem;
            pointer-events: none;
        }

        input {
            width: 100%;
            padding: 16px 48px 16px 16px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 14px;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-purple);
            background: rgba(15, 23, 42, 0.95);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.25);
            transform: translateY(-2px);
        }

        .input-group:focus-within i {
            color: var(--accent-purple);
            transform: translateY(-50%) scale(1.1);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(109, 40, 217, 0.4);
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(109, 40, 217, 0.6);
            filter: brightness(1.1);
        }

        .submit-btn:active { transform: translateY(1px) scale(0.98); }

        .error-message {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            display: none;
            animation: fadeUp 0.3s ease-out forwards;
        }

        .credit {
            margin-top: 25px;
            color: rgba(148, 163, 184, 0.6);
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* התאמות מיוחדות למסכים קטנים מאוד */
        @media (max-height: 650px) {
            body { padding: 10px; }
            .login-card { padding: 25px 20px; }
            .icon-wrapper { width: 55px; height: 55px; font-size: 1.5rem; margin-bottom: 10px; }
            h1 { font-size: 1.6rem; }
            p.subtitle { margin-bottom: 20px; }
            input, .submit-btn { padding: 12px 42px 12px 14px; font-size: 0.95rem; }
            .submit-btn { padding: 12px; }
        }
    </style>
</head>
<body>

<!-- כדורי תאורה ברקע -->
<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>

<div class="login-card">
    <div class="icon-wrapper">
        <i class="fas fa-fingerprint"></i>
    </div>
    <h1>ברוך שובך</h1>
    <p class="subtitle">ניהול תקציב חכם</p>

    <div id="error-box" class="error-message">
        <i class="fas fa-exclamation-triangle"></i> שם משתמש או סיסמה שגויים
    </div>

    <form action="/login" method="POST">
        <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" name="username" placeholder="שם משתמש" required autocomplete="off">
        </div>

        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" name="password" placeholder="סיסמה" required>
        </div>

        <button type="submit" class="submit-btn">
            התחבר <i class="fas fa-arrow-left"></i>
        </button>
    </form>

    <div class="credit">פותח ע"י ניב אגוז</div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('error')) {
        document.getElementById('error-box').style.display = 'block';
    }
</script>
</body>
</html>
